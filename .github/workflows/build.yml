name: Build Hamsat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android files
        run: flutter create --platforms=android --project-name hamsat .

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Check APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "Checking APK file..."
          ls -lh "$APK"
          file "$APK"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"

          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt tool was not found"
            exit 1
          fi

          "$AAPT" dump badging "$APK" | head -n 10
          sha256sum "$APK"

      - name: Verify APK signature
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "Verifying APK signature..."

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner tool was not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "APK signature verification finished."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamsat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
